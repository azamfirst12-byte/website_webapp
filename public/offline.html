<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070912; color: #e8ebf7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 22px; background: linear-gradient(90deg, #7c5cff, #22d3ee); -webkit-background-clip: text; color: transparent; }
      button { margin-top: 16px; border: 0; border-radius: 999px; padding: 10px 22px; background: linear-gradient(90deg, #7c5cff, #22d3ee); color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Reconnect to browse the site and talk to the assistant.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
